// Build.gradle generated for instrumentation module Mule-Http-1.4

apply plugin: 'java'

dependencies {
    implementation 'org.mule.services:mule-service-http:1.3.0'
    implementation 'org.mule.runtime:mule-service-http-api:4.2.0'


    // New Relic Labs Java Agent dependencies
    implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
    implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
}

jar {
    manifest {
        attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.Mule-Http-1.2'
        attributes 'Implementation-Vendor': 'New Relic Labs'
        attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
        attributes 'Implementation-Version': 1.0
    }
}

verifyInstrumentation {
    passes("org.mule.services:mule-service-http:(1.2.0,1.4.0)")
            {
                implementation("org.mule.runtime:mule-service-http-api:4.3.0")
            }
    passes("org.mule.services:mule-service-http:(1.4.0,1.5.18)") {
        implementation "org.mule.runtime:mule-service-http-api:4.3.0"
    }
    passes("org.mule.services:mule-service-http:[1.6.0,1.8.24)") {
        implementation 'org.mule.runtime:mule-service-http-api:4.3.0'
    }
    passes("org.mule.services:mule-service-http:[1.9.0,1.11.24)") {
        implementation 'org.mule.runtime:mule-service-http-api:4.3.0'
    }
    passes("org.mule.services:mule-service-http:[1.12.0,1.12.1)") {
        implementation 'org.mule.runtime:mule-service-http-api:4.3.0'
    }
    exclude 'org.mule.services:mule-service-http:1.5.18'
    exclude 'org.mule.services:mule-service-http:1.11.17'
    exclude 'org.mule.services:mule-service-http:1.6.19'
    excludeRegex 'org.mule.services:mule-service-http:1.11.1[0-6]'
    excludeRegex '.*MULE.*'
    excludeRegex '.*SNAPSHOT.*'
    excludeRegex '.*-M.*'
    excludeRegex '.*rc.*'
}