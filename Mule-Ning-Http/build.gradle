apply plugin: 'java'

dependencies {
    implementation 'com.ning:async-http-client:1.9.40'

    // New Relic Java Agent dependencies
    implementation 'com.newrelic.agent.java:newrelic-agent:8.25.0'
    implementation 'com.newrelic.agent.java:newrelic-api:8.25.0'
    implementation fileTree(include: ['*.jar'], dir: '../libs')
}

jar {
    manifest {
        attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.Mule-Ning-Http'
        attributes 'Implementation-Vendor': 'New Relic Labs'
        attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
        attributes 'Implementation-Version': 1.0
    }
}

verifyInstrumentation {
    passes 'com.ning:async-http-client:[1.6.1,)'
    excludeRegex '.*SNAPSHOT'
    excludeRegex '.*MULE.*'
    excludeRegex '.*BETA.*'
}
