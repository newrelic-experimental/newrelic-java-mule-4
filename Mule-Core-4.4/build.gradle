
// Build.gradle generated for instrumentation module Mule-Core-4.4

apply plugin: 'java'

dependencies {
    implementation 'org.mule.runtime:mule-core:4.4.0'

    // New Relic Labs Java Agent dependencies
    implementation 'com.newrelic.agent.java:newrelic-agent:8.4.0'
    implementation 'com.newrelic.agent.java:newrelic-api:8.4.0'
    implementation 'com.newrelic.agent.java:agent-bridge:8.4.0'

}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.Mule-Core-4.4.0'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': 1.0
  }
}

verifyInstrumentation {
    passes 'org.mule.runtime:mule-core:[4.4.0,4.5.0)'
    passes 'org.mule.runtime:mule-core:(4.5.0,4.5.1)'
    excludeRegex 'org.mule.runtime:mule-core:4.4.0-2024.*'
    excludeRegex 'org.mule.runtime:mule-core:4.4.0-2025.*'
    excludeRegex '.*MULE.*'
    excludeRegex '.*SNAPSHOT'
}
